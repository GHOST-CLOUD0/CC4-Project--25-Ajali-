# Render Blueprint — one-click deploy of the Ajali! backend + PostgreSQL.
# Render dashboard → New+ → Blueprint → pick this repo.
services:
  - type: web
    name: ajali-api
    runtime: python
    plan: free
    region: frankfurt # closest Render region to Kenya (lowest latency)
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    healthCheckPath: /api/v1/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ajali-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false # set this to your frontend URL, e.g. https://ajali-ke.netlify.app

databases:
  - name: ajali-db
    plan: free
    region: frankfurt
